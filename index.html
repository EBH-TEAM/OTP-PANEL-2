        .c-sky { background: linear-gradient(135deg, #0284c7, #38bdf8); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.35); }
        .c-purple { background: linear-gradient(135deg, #6d28d9, #8b5cf6); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35); }
        .c-rose { background: linear-gradient(135deg, #be123c, #f43f5e); box-shadow: 0 4px 12px rgba(244, 63, 94, 0.35); }
        .c-amber { background: linear-gradient(135deg, #b45309, #f59e0b); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }

</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] hidden px-4 py-2 rounded-full c-green text-white text-xs font-bold shadow-2xl transition-all">
        Copied!

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-[#060913] flex flex-col items-center justify-center p-4 hidden">
        <div class="w-full max-w-sm glass-panel rounded-3xl p-6 space-y-5 shadow-2xl border border-blue-500/30">

            </div>
            <div id="loginStep1" class="space-y-3">

                <button onclick="checkAndSendLoginOtp()" id="sendCodeBtn" class="w-full py-3 c-blue active:scale-95 rounded-xl font-extrabold text-xs text-white transition-all">

            </div>
            <div id="loginStep2" class="space-y-3 hidden">

                    <label class="text-[11px] font-bold text-emerald-400 block mb-1">Enter 6-Digit Code from Telegram:</label>

                <button onclick="verifyLoginOtp()" class="w-full py-3 c-green active:scale-95 rounded-xl font-extrabold text-xs text-white transition-all">

    <!-- User Header with Name, Avatar & Balance -->

                    <span class="absolute -bottom-1 -right-1 w-3 h-3 bg-emerald-500 border-2 border-[#060913] rounded-full"></span>
                </div>
                <div>
                    <h2 id="userDisplayName" class="text-xs font-extrabold text-white group-hover:text-sky-400 transition-colors flex items-center">
                        <span id="headerNameText">Telegram User</span>
                        <i class="fa-solid fa-circle-info text-[10px] text-sky-400 ml-1"></i>
                    </h2>
                    <p class="text-[10px] text-emerald-400 font-mono font-bold">Balance: ৳<span id="userBalanceDisplay">0.00</span></p>

            </div>

            <div class="flex items-center space-x-2">
                <button onclick="renderMyOtpView()" class="px-4 py-2 c-amber rounded-2xl text-xs font-black text-white shadow-xl flex items-center space-x-1.5 active:scale-95 transition-all">

                    <span>MY OTP (<span id="otpCountBadge">0</span>)</span>

    <!-- Main Content Area -->
    <main id="screenContainer" class="w-full max-w-md mx-auto flex-1 overflow-y-auto p-3 pb-24 space-y-3 hidden">
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-[#090d1c]/95 backdrop-blur-lg border-t border-slate-800/80 p-2.5 shadow-2xl z-40 hidden">
        <div class="w-full max-w-md mx-auto grid grid-cols-4 gap-1.5">
            <button onclick="renderActiveNumbersView()" class="py-2.5 px-1 c-rose active:scale-95 transition-all rounded-xl text-[10px] font-extrabold text-white flex flex-col items-center justify-center space-y-1">
                <i class="fa-solid fa-inbox text-xs"></i>
                <span>MY NUMBERS</span>
            </button>
            <button onclick="loadServices()" class="py-2.5 px-1 c-blue active:scale-95 transition-all rounded-xl text-[10px] font-extrabold text-white flex flex-col items-center justify-center space-y-1">
                <i class="fa-solid fa-phone-volume text-xs"></i>
                <span>GET NUMBER</span>

            <button onclick="openCustomRange()" class="py-2.5 px-1 c-purple active:scale-95 transition-all rounded-xl text-[10px] font-extrabold text-white flex flex-col items-center justify-center space-y-1">
                <i class="fa-solid fa-globe text-xs"></i>
                <span>CUSTOM RANGE</span>

            <button onclick="loadLiveTraffic()" class="py-2.5 px-1 c-green active:scale-95 transition-all rounded-xl text-[10px] font-extrabold text-white flex flex-col items-center justify-center space-y-1">
                <i class="fa-solid fa-wave-square text-xs"></i>
                <span>LIVE TRAFFIC</span>
            </button>

    <script>
        const BOT_TOKEN = "8605052510:AAFgmeUM8a3qV0yTrqU1EvSdd9fbWd4w9sc";
        const FIREBASE_DB_URL = "https://otp-oanel-2-default-rtdb.firebaseio.com";
        const ADMIN_CHAT_ID = "6140196943";
        const CURRENCY = "৳";

        // New Panel Configuration (SL Virtual Number API)
        const SL_API_KEY = "sl_live_d22875e4c583fb66bbee58250d46e5a8e52fc1a38ddac922";
        const SL_API_BASE = "https://slvirtualnumber.com/api/v1/developer";
        const RENT_API = `${SL_API_BASE}/rent`;
        const OTP_MONITOR_API = `${SL_API_BASE}/otp-monitor`;
        const CHECK_OTP_API = `${SL_API_BASE}/check-otp`;

        // Number Validity Time: 25 Minutes in Milliseconds
        const NUMBER_VALIDITY_MS = 25 * 60 * 1000;

        let currentUser = null;
        let generatedLoginOtp = null;
        let pendingChatId = null;
        let verifiedUserData = null;

        let userCloudData = {
            profile: { name: "User", username: "", photo: "", joinedAt: "" },
            stats: { totalNumbersTaken: 0, totalSuccessOtps: 0, balance: 0.00 },
            activeNumbers: [],
            successOtps: [],
            numberLogs: []
        };

        let globalSettings = {
            otpRate: 5.00,
            numberLimit: 2,
            withdrawMethods: "Bkash, Nagad, Rocket",
            minWithdraw: 50.00,
            defaultTag: "SLVN-ETH-3",
            defaultCountry: "ET",
            defaultService: "ANY (All Services)"
        };
        let pendingWithdraws = {};
        let fetchedMonitorData = [];
        let lastSelectedRange = localStorage.getItem('ebh_last_range') || null;
        let lastSelectedService = localStorage.getItem('ebh_last_service') || 'ANY (All Services)';
        let lastSelectedCountryCode = localStorage.getItem('ebh_last_country') || 'ET';
        let pendingWithdrawOtp = null;
        let pendingWithdrawDetails = null;
        let cachedAllUsers = {};

        const SERVICE_ICONS = {
            "FACEBOOK": "fa-brands fa-facebook text-white bg-blue-600 px-1.5 py-1 rounded-md",
            "TELEGRAM": "fa-brands fa-telegram text-white bg-sky-500 px-1.5 py-1 rounded-md",
            "WHATSAPP": "fa-brands fa-whatsapp text-white bg-emerald-600 px-1.5 py-1 rounded-md",
            "GOOGLE": "fa-brands fa-google text-white bg-red-500 px-1.5 py-1 rounded-md",
            "INSTAGRAM": "fa-brands fa-instagram text-white bg-pink-600 px-1.5 py-1 rounded-md",
            "IMO": "fa-solid fa-video text-white bg-amber-600 px-1.5 py-1 rounded-md",
            "PAYPAL": "fa-brands fa-paypal text-white bg-blue-500 px-1.5 py-1 rounded-md",
            "MASTERCARD": "fa-solid fa-credit-card text-white bg-purple-600 px-1.5 py-1 rounded-md",
            "DING": "fa-solid fa-bolt text-white bg-yellow-600 px-1.5 py-1 rounded-md",
            "SHOP": "fa-solid fa-shopping-cart text-white bg-rose-600 px-1.5 py-1 rounded-md",
            "TIKTOK": "fa-brands fa-tiktok text-white bg-black px-1.5 py-1 rounded-md",
            "TWITTER": "fa-brands fa-twitter text-white bg-sky-400 px-1.5 py-1 rounded-md",
            "DISCORD": "fa-brands fa-discord text-white bg-indigo-600 px-1.5 py-1 rounded-md"
        };

        function getServiceIcon(serviceName) {
            let s = serviceName ? serviceName.toUpperCase() : "SMS";
            for (const key of Object.keys(SERVICE_ICONS)) {
                if (s.includes(key)) return SERVICE_ICONS[key];
            }
            return "fa-solid fa-mobile-screen text-white bg-slate-700 px-1.5 py-1 rounded-md";
        }

        function slHeaders() {
            return {
                "x-api-key": SL_API_KEY,
                "Content-Type": "application/json",
                "Accept": "application/json"
            };
        }

        function extractOtpFromText(text) {
            if (!text) return null;
            const match = String(text).match(/\b\d{4,8}\b/);
            return match ? match[0] : null;
        }

        function extractMonitorItems(rawJson) {
            if (!rawJson) return [];
            if (Array.isArray(rawJson)) return rawJson;
            if (Array.isArray(rawJson.data)) return rawJson.data;
            if (rawJson.data && Array.isArray(rawJson.data.hits)) return rawJson.data.hits;
            if (rawJson.data && Array.isArray(rawJson.data.otps)) return rawJson.data.otps;
            if (rawJson.data && Array.isArray(rawJson.data.messages)) return rawJson.data.messages;
            if (rawJson.data && Array.isArray(rawJson.data.items)) return rawJson.data.items;
            if (Array.isArray(rawJson.logs)) return rawJson.logs;
            if (Array.isArray(rawJson.otps)) return rawJson.otps;
            return [];
        }

        function extractRentedNumberAndRentalId(resJson, fallbackTag) {
            const d = (resJson && resJson.data) ? resJson.data : (resJson || {});
            const rawNum = d.number || d.phone || d.phoneNumber || d.full_number || d.msisdn || d.mobile || "";
            const rentalId = d.rentalId || d.rental_id || d.id || d._id || d.orderId || d.order_id || null;
            const tag = d.tag || d.range || fallbackTag || globalSettings.defaultTag || "SLVN-ETH-3";
            const service = d.service || globalSettings.defaultService || "ANY (All Services)";
            const countryCode = d.countryCode || d.country_code || d.country || globalSettings.defaultCountry || "ET";
            const formattedNum = rawNum ? ("+" + String(rawNum).replace(/^\+/, "").trim()) : "";
            return { number: formattedNum, rentalId, tag, service, countryCode };
        }

        async function fetchGlobalSettings() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/settings.json`);
                const data = await res.json();
                if (data) globalSettings = { ...globalSettings, ...data };

                const wRes = await fetch(`${FIREBASE_DB_URL}/withdraws.json`);
                const wData = await wRes.json();
                if (wData) pendingWithdraws = wData;
            } catch (e) {}
        }

        async function syncGlobalSettings() {
            try {
                await fetch(`${FIREBASE_DB_URL}/settings.json`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(globalSettings)
                });
            } catch (e) {}
        }

        async function syncWithdrawsToFirebase() {
            try {
                await fetch(`${FIREBASE_DB_URL}/withdraws.json`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(pendingWithdraws)
                });
            } catch (e) {}
        }

        async function fetchTelegramProfilePhoto(userId) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUserProfilePhotos?user_id=${userId}&limit=1`);
                const data = await res.json();
                if (data.ok && data.result.total_count > 0) {
                    const fileId = data.result.photos[0][0].file_id;
                    const fileRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                    const fileData = await fileRes.json();
                    if (fileData.ok && fileData.result.file_path) {
                        return `https://api.telegram.org/file/bot${BOT_TOKEN}/${fileData.result.file_path}`;
                    }
                }
            } catch (e) {}
            return null;
        }

        window.onload = async () => {
            await fetchGlobalSettings();
            const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.ready();
                tg.expand();
                const u = tg.initDataUnsafe.user;
                let fullName = `${u.first_name || ''} ${u.last_name || ''}`.trim() || "Telegram User";
                let uname = u.username ? `@${u.username}` : "@NoUsername";
                let userPhoto = u.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(fullName)}&background=2563eb&color=fff`;

                currentUser = {
                    id: u.id.toString(),
                    name: fullName,
                    username: uname,
                    photo: userPhoto,
                    isMiniApp: true
                };
                await initializeCloudSession();
            } else {
                const savedSession = localStorage.getItem('ebh_web_user');
                if (savedSession) {
                    currentUser = JSON.parse(savedSession);
                    const existingCloud = await fetchUserFromFirebase(currentUser.id);
                    if (existingCloud && existingCloud.profile && existingCloud.profile.name && !existingCloud.profile.name.includes("User (")) {
                        currentUser.name = existingCloud.profile.name;
                        currentUser.username = existingCloud.profile.username || currentUser.username;
                        currentUser.photo = existingCloud.profile.photo || currentUser.photo;
                        await initializeCloudSession();
                    } else {
                        localStorage.removeItem('ebh_web_user');
                        document.getElementById('loginScreen').classList.remove('hidden');
                        showToast("⚠️ আগে টেলিগ্রাম বট থেকে মিনি অ্যাপ ওপেন করুন!");
                    }
                } else {
                    document.getElementById('loginScreen').classList.remove('hidden');
                }
            }
        };

        async function initializeCloudSession() {
            let fetchedPhoto = currentUser.photo;
            const tgPic = await fetchTelegramProfilePhoto(currentUser.id);
            if (tgPic) fetchedPhoto = tgPic;
            currentUser.photo = fetchedPhoto;

            const existingCloud = await fetchUserFromFirebase(currentUser.id);
            if (existingCloud) {
                userCloudData = {
                    profile: existingCloud.profile || {},
                    stats: existingCloud.stats || { totalNumbersTaken: 0, totalSuccessOtps: 0, balance: 0.00 },
                    activeNumbers: existingCloud.activeNumbers || [],
                    successOtps: existingCloud.successOtps || [],
                    numberLogs: existingCloud.numberLogs || []
                };

                const now = Date.now();
                userCloudData.activeNumbers = userCloudData.activeNumbers.filter(item => {
                    const exp = item.expiresAt || ((item.createdAt || item.id) + NUMBER_VALIDITY_MS);
                    return exp > now;
                });

                if (currentUser.isMiniApp && currentUser.name && !currentUser.name.includes("User (")) {
                    userCloudData.profile.name = currentUser.name;
                    userCloudData.profile.username = currentUser.username;
                } else if (existingCloud.profile && existingCloud.profile.name) {
                    currentUser.name = existingCloud.profile.name;
                    currentUser.username = existingCloud.profile.username;
                }

                userCloudData.profile.photo = fetchedPhoto;
                await syncUserToFirebase();
            } else {
                if (!currentUser.isMiniApp) {
                    document.getElementById('loginScreen').classList.remove('hidden');
                    showToast("⚠️ আগে টেলিগ্রাম মিনি অ্যাপ ওপেন করুন!");
                    return;
                }
                userCloudData = {
                    profile: { name: currentUser.name, username: currentUser.username || "@TelegramUser", photo: fetchedPhoto, joinedAt: new Date().toLocaleDateString() },
                    stats: { totalNumbersTaken: 0, totalSuccessOtps: 0, balance: 0.00 },
                    activeNumbers: [],
                    successOtps: [],
                    numberLogs: []
                };
                await syncUserToFirebase();
            }
            unlockApp();
        }

        async function fetchUserFromFirebase(userId) {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}/users/${userId}.json`);
                return await res.json() || null;
            } catch (e) { return null; }
        }

        async function syncUserToFirebase() {
            if (!currentUser || !currentUser.id) return;
            try {
                await fetch(`${FIREBASE_DB_URL}/users/${currentUser.id}.json`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(userCloudData)
                });
            } catch (e) {}
        }

        function unlockApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('userHeader').classList.remove('hidden');
            document.getElementById('screenContainer').classList.remove('hidden');
            document.getElementById('bottomNav').classList.remove('hidden');

            document.getElementById('headerNameText').innerText = currentUser.name;
            document.getElementById('userAvatar').src = currentUser.photo;
            document.getElementById('userBalanceDisplay').innerText = (userCloudData.stats.balance || 0).toFixed(2);

            if (!currentUser.isMiniApp) document.getElementById('logoutBtn').classList.remove('hidden');
            updateOtpBadge();
            renderActiveNumbersView();
        }

        function updateOtpBadge() {
            document.getElementById('otpCountBadge').innerText = (userCloudData.successOtps || []).length;
            document.getElementById('userBalanceDisplay').innerText = (userCloudData.stats.balance || 0).toFixed(2);
        }

        async function sendTelegramBotMessage(chatId, htmlText) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: chatId, text: htmlText, parse_mode: "HTML" })
                });
                return await res.json();
            } catch (e) { return { ok: false }; }
        }

        async function checkAndSendLoginOtp() {
            const chatIdInput = document.getElementById('loginChatId').value.trim();
            if (!chatIdInput) { showToast("⚠️ সঠিক Telegram Chat ID দিন!"); return; }

            showToast("🔍 ডাটাবেজ চেক করা হচ্ছে...");
            const existingData = await fetchUserFromFirebase(chatIdInput);

            if (!existingData || !existingData.profile || !existingData.profile.name || existingData.profile.name.includes("User (") || existingData.profile.name === "User") {
                alert("❌ এক্সেস ডিনায়ার্ড!\n\nআপনি আগে কখনো টেলিগ্রাম বট থেকে মিনি অ্যাপ ওপেন করেননি। ব্রাউজার ব্যবহার করতে হলে প্রথমে অবশ্যই টেলিগ্রাম বট থেকে মিনি অ্যাপ ওপেন করে রেজিস্ট্রেশন করতে হবে।");
                return;
            }

            verifiedUserData = existingData;

            const otpCode = Math.floor(100000 + Math.random() * 900000).toString();
            const result = await sendTelegramBotMessage(chatIdInput, `🔐 <b>BROWSER LOGIN OTP</b>\n\n<blockquote>🔑 Code: <code>${otpCode}</code></blockquote>`);

            if (result && result.ok) {
                generatedLoginOtp = otpCode;
                pendingChatId = chatIdInput;

        async function sendWithdrawOtpRequest() {
            const method = document.getElementById('wMethod').value;
            const account = document.getElementById('wAccount').value.trim();
            const amount = parseFloat(document.getElementById('wAmount').value);
            const balance = userCloudData.stats.balance || 0;

            if (!account) { showToast("⚠️ একাউন্ট নাম্বার দিন!"); return; }
            if (isNaN(amount) || amount < globalSettings.minWithdraw) { showToast(`⚠️ সর্বনিম্ন উইথড্র ৳${globalSettings.minWithdraw}!`); return; }
            if (amount > balance) { showToast("⚠️ পর্যাপ্ত ব্যালেন্স নেই!"); return; }

            pendingWithdrawOtp = Math.floor(100000 + Math.random() * 900000).toString();
            pendingWithdrawDetails = { method, account, amount, time: new Date().toLocaleString() };

            const res = await sendTelegramBotMessage(currentUser.id, `🔐 <b>WITHDRAW CONFIRMATION OTP</b>\n\n<blockquote>🔑 Code: <code>${pendingWithdrawOtp}</code></blockquote>`);
            if (res && res.ok) {
                renderWithdrawVerifyView();
                showToast("✅ টেলিগ্রামে কনফার্মেশন কোড পাঠানো হয়েছে!");
            } else {
                showToast("❌ কোড পাঠানো যায়নি! বট স্টার্ট করা আছে কিনা চেক করুন।");
            }
        }

        async function adminActionWithdraw(reqId, action) {
            const req = pendingWithdraws[reqId];
            if (!req) return;

            if (action === 'Confirm') {
                req.status = 'Confirmed';
                await sendTelegramBotMessage(req.userId, `✅ <b>WITHDRAW CONFIRMED!</b>\n\nআপনার ৳${req.amount} উইথড্র রিকোয়েস্ট সফলভাবে কনফার্ম করা হয়েছে।`);
                showToast("✅ উইথড্র কনফার্ম করা হয়েছে!");
            } else {
                req.status = 'Cancelled';
                const uData = await fetchUserFromFirebase(req.userId);
                if (uData) {
                    if (!uData.stats) uData.stats = { totalNumbersTaken: 0, totalSuccessOtps: 0, balance: 0 };
                    uData.stats.balance = (uData.stats.balance || 0) + req.amount;
                    await fetch(`${FIREBASE_DB_URL}/users/${req.userId}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(uData)
                    });
                }
                await sendTelegramBotMessage(req.userId, `❌ <b>WITHDRAW CANCELLED!</b>\n\nআপনার ৳${req.amount} উইথড্র রিকোয়েস্ট বাতিল করা হয়েছে এবং ব্যালেন্স রিফান্ড করা হয়েছে।`);
                showToast("❌ উইথড্র বাতিল ও ব্যালেন্স রিফান্ড করা হয়েছে!");
            }

            delete pendingWithdraws[reqId];
            await syncWithdrawsToFirebase();
            renderAdminPanelView();
        }

        function getCountryInfo(rangeOrNum) {
            const upper = String(rangeOrNum || "").toUpperCase().trim();
            if (ISO_TO_INFO[upper]) return ISO_TO_INFO[upper];
            let digits = upper.replace(/\D/g, '');
            for (let i = 4; i >= 1; i--) {
                let prefix = digits.substring(0, i);
                if (WORLD_COUNTRIES[prefix]) return WORLD_COUNTRIES[prefix];
            }
            return { flag: "🇪🇹", name: "Ethiopia", short: "ET" };
        }

        async function fetchMonitorHits(tag = null, service = null) {
            const useTag = encodeURIComponent(tag || globalSettings.defaultTag || "SLVN-ETH-3");
            const useSrv = encodeURIComponent(service || "ANY");
            const url = `${OTP_MONITOR_API}?limit=100&service=${useSrv}&tag=${useTag}`;
            const res = await fetch(url, { headers: slHeaders() });
            const json = await res.json();
            return extractMonitorItems(json);

        async function loadServices() {
            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-xl text-sky-400 mr-2"></i> লোড হচ্ছে...</div>`;

            try {
                fetchedMonitorData = await fetchMonitorHits();
                let servicesMap = {};
                const defSrv = globalSettings.defaultService || "ANY (All Services)";
                const defTag = globalSettings.defaultTag || "SLVN-ETH-3";
                const defCountry = globalSettings.defaultCountry || "ET";

                servicesMap[defSrv] = [{ tag: defTag, countryCode: defCountry }];

                fetchedMonitorData.forEach(item => {
                    let sid = (item.service || item.sid || defSrv).toString().toUpperCase();
                    let tag = (item.tag || item.range || defTag).toString();
                    let cCode = (item.countryCode || item.country_code || defCountry).toString().toUpperCase();
                    if (!servicesMap[sid]) servicesMap[sid] = [];
                    if (!servicesMap[sid].some(x => x.tag === tag && x.countryCode === cCode)) {
                        servicesMap[sid].push({ tag, countryCode: cCode });
                    }
                });

                let html = `<div class="glass-panel rounded-2xl p-4 space-y-3 shadow-2xl pb-6"><h3 class="text-xs font-extrabold text-sky-400 uppercase border-b border-slate-800 pb-2">SELECT SERVICE</h3><div class="grid grid-cols-2 gap-2.5">`;
                Object.keys(servicesMap).forEach((srv, idx) => {
                    let iconClass = getServiceIcon(srv);
                    html += `<button onclick="loadCountriesForService('${encodeURIComponent(srv)}')" class="p-3.5 ${getRandomColor(idx)} active:scale-95 rounded-xl text-xs font-extrabold text-white text-center shadow-md flex items-center justify-center space-x-2"><i class="${iconClass} text-sm"></i><span class="truncate">${srv}</span></button>`;
                });
                html += `</div></div>`;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400">API এরর!</div>`;
            }
        }

        function loadCountriesForService(encodedServiceName) {
            const serviceName = decodeURIComponent(encodedServiceName);
            lastSelectedService = serviceName;
            localStorage.setItem('ebh_last_service', serviceName);

            const container = document.getElementById('screenContainer');
            const defTag = globalSettings.defaultTag || "SLVN-ETH-3";
            const defCountry = globalSettings.defaultCountry || "ET";

            let entries = [];
            fetchedMonitorData.forEach(item => {
                let sid = (item.service || item.sid || globalSettings.defaultService || "ANY (All Services)").toString().toUpperCase();
                if (sid === serviceName.toUpperCase() || serviceName.toUpperCase().includes("ANY")) {
                    let cCode = (item.countryCode || item.country_code || defCountry).toString().toUpperCase();
                    let tag = (item.tag || item.range || defTag).toString();
                    entries.push({ cCode, tag });
                }
            });

            if (entries.length === 0) {
                entries.push({ cCode: defCountry, tag: defTag });
            }

            let html = `<div class="glass-panel rounded-2xl p-4 space-y-3 shadow-2xl pb-6"><div class="flex items-center justify-between border-b border-slate-800 pb-2"><h3 class="text-xs font-extrabold text-amber-400 uppercase truncate">${serviceName} - COUNTRIES</h3><button onclick="loadServices()" class="text-[10px] font-bold text-white c-rose px-2.5 py-1 rounded-lg">Back</button></div><div class="space-y-2">`;
            entries.forEach((ent, idx) => {
                let cInfo = getCountryInfo(ent.cCode || ent.tag);
                let cKey = `${cInfo.flag} ${cInfo.name} - ${cInfo.short} (${ent.tag})`;
                html += `<div onclick="buyTwoNumbers('${encodeURIComponent(ent.tag)}', '${encodeURIComponent(serviceName)}', '${encodeURIComponent(ent.cCode)}')" class="p-3 ${getRandomColor(idx + 1)} active:scale-95 rounded-xl flex items-center justify-between cursor-pointer shadow-md"><span class="text-xs font-extrabold text-white truncate">${cKey}</span><span class="text-[10px] font-mono text-white bg-black/30 px-2.5 py-1 rounded-lg font-bold flex-shrink-0 ml-2">Get ${globalSettings.numberLimit || 2}</span></div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        async function buyTwoNumbers(encodedTag, encodedServiceTitle, encodedCountryCode = "") {
            const tagId = decodeURIComponent(encodedTag);
            const serviceTitle = decodeURIComponent(encodedServiceTitle);
            const countryCode = encodedCountryCode ? decodeURIComponent(encodedCountryCode) : (globalSettings.defaultCountry || "ET");

            lastSelectedRange = tagId;
            lastSelectedService = serviceTitle;
            lastSelectedCountryCode = countryCode;
            localStorage.setItem('ebh_last_range', tagId);
            localStorage.setItem('ebh_last_service', serviceTitle);
            localStorage.setItem('ebh_last_country', countryCode);

            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-xl text-emerald-400 mr-2"></i> নাম্বার জেনারেট হচ্ছে...</div>`;

            let limit = globalSettings.numberLimit || 2;
            let newFetchedNumbers = [];
            const nowTs = Date.now();

            for (let i = 0; i < limit; i++) {
                try {
                    const payload = {
                        service: serviceTitle || globalSettings.defaultService || "ANY (All Services)",
                        countryCode: countryCode || globalSettings.defaultCountry || "ET",
                        tag: tagId || globalSettings.defaultTag || "SLVN-ETH-3"
                    };
                    const response = await fetch(RENT_API, {
                        method: "POST",
                        headers: slHeaders(),
                        body: JSON.stringify(payload)
                    });
                    const resData = await response.json();
                    const parsed = extractRentedNumberAndRentalId(resData, tagId);

                    if (parsed.number) {
                        newFetchedNumbers.push({
                            id: nowTs + i,
                            rentalId: parsed.rentalId,
                            number: parsed.number,
                            range: parsed.tag,
                            countryCode: parsed.countryCode,
                            service: serviceTitle,
                            otp: null,
                            notified: false,
                            createdAt: nowTs,
                            expiresAt: nowTs + NUMBER_VALIDITY_MS
                        });
                    }
                } catch (e) {}
            }

            if (newFetchedNumbers.length > 0) {
                userCloudData.activeNumbers = newFetchedNumbers;
                userCloudData.stats.totalNumbersTaken = (userCloudData.stats.totalNumbersTaken || 0) + newFetchedNumbers.length;

                if (!Array.isArray(userCloudData.numberLogs)) userCloudData.numberLogs = [];
                newFetchedNumbers.forEach(() => userCloudData.numberLogs.push(nowTs));
                const sevenDaysAgo = nowTs - (7 * 24 * 60 * 60 * 1000);
                userCloudData.numberLogs = userCloudData.numberLogs.filter(t => t >= sevenDaysAgo);

                await syncUserToFirebase();
                renderActiveNumbersView();
            } else {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400 font-bold">এই রেঞ্জে নাম্বার খালি নেই!</div>`;
            }
        }

        function formatRemainingTime(ms) {
            if (ms <= 0) return "00:00";
            const totalSecs = Math.floor(ms / 1000);
            const mins = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            const secs = (totalSecs % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function renderActiveNumbersView() {
            const container = document.getElementById('screenContainer');
            const now = Date.now();
            const myNums = (userCloudData.activeNumbers || []).filter(item => {
                const exp = item.expiresAt || ((item.createdAt || item.id) + NUMBER_VALIDITY_MS);
                return exp > now;
            });

            if (myNums.length === 0) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center space-y-3 shadow-xl"><div class="w-12 h-12 c-blue text-white rounded-2xl mx-auto flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-satellite-dish"></i></div><h1 class="text-base font-extrabold text-white">EBH SMS CLOUD PANEL</h1><p class="text-xs text-slate-400">GET NUMBER এ ক্লিক করে নাম্বার নিন। প্রতিটি নাম্বার ২৫ মিনিট পর্যন্ত সক্রিয় থাকবে।</p></div>`;
                return;
            }

            let html = `<div class="space-y-3 pb-6"><div class="flex justify-between items-center px-1"><h3 class="text-xs font-extrabold text-emerald-400 uppercase">📦 ACTIVE NUMBERS (25m Valid)</h3><button onclick="clearHistory()" class="text-[10px] c-rose px-2.5 py-1 rounded-lg text-white font-bold">Clear</button></div>`;
            myNums.forEach(item => {
                let cInfo = getCountryInfo(item.countryCode || item.number || item.range);
                const exp = item.expiresAt || ((item.createdAt || item.id) + NUMBER_VALIDITY_MS);
                const remStr = formatRemainingTime(exp - now);

                html += `
                    <div class="glass-panel rounded-2xl p-4 space-y-3 shadow-xl border-l-4 ${item.otp ? 'border-emerald-400' : 'border-sky-400'}">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-extrabold text-white">${cInfo.flag} ${cInfo.name}</span>
                            <div class="flex items-center space-x-1.5">
                                <span data-expires="${exp}" class="num-timer-badge text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded font-mono font-bold"><i class="fa-regular fa-clock mr-1"></i>${remStr}</span>
                                <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-mono font-bold">+৳${globalSettings.otpRate}</span>
                                <span class="c-purple px-2 py-0.5 rounded-full text-[10px] text-white font-bold truncate max-w-[90px]">${item.service}</span>
                            </div>
                        </div>
                        <div onclick="copyText('${item.number}', 'Number')" class="cursor-pointer active:scale-95 transition-all text-lg font-mono font-black text-white c-sky p-3.5 rounded-xl text-center shadow-md select-all">
                            📞 ${item.number}
                        </div>
                        ${item.otp ? `
                            <div onclick="copyText('${item.otp}', 'OTP Code')" class="cursor-pointer active:scale-95 transition-all c-green p-3 rounded-xl text-center shadow-lg relative">
                                <div class="text-[10px] text-emerald-100 uppercase font-bold flex justify-between px-2">
                                    <span>Tap to Copy OTP</span>
                                    <span class="text-yellow-300 font-mono">+৳${globalSettings.otpRate} Added</span>
                                </div>
                                <div class="text-2xl font-mono font-black text-white tracking-widest mt-0.5">🔑 ${item.otp}</div>
                            </div>
                        ` : `
                            <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl text-center text-xs font-bold text-amber-400 animate-pulse">
                                ⌛ Waiting for incoming OTP... (Valid: 25 Min)
                            </div>
                        `}
                    </div>
                `;
            });

            if (lastSelectedRange) {
                html += `<div class="pt-1"><button onclick="buyTwoNumbers('${encodeURIComponent(lastSelectedRange)}', '${encodeURIComponent(lastSelectedService)}', '${encodeURIComponent(lastSelectedCountryCode)}')" class="w-full py-4 c-next-btn active:scale-95 rounded-2xl font-black text-sm text-white transition-all flex items-center justify-center space-x-2"><i class="fa-solid fa-arrows-rotate text-base"></i><span>NEXT NUMBERS (${globalSettings.numberLimit}) &bull; [${lastSelectedRange}]</span></button></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderMyOtpView() {
            const container = document.getElementById('screenContainer');
            const myOtps = userCloudData.successOtps || [];

            if (myOtps.length === 0) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center space-y-3 shadow-xl border border-amber-500/30"><div class="w-12 h-12 c-amber text-white rounded-2xl mx-auto flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-key"></i></div><h1 class="text-base font-extrabold text-white">MY OTP INBOX</h1><p class="text-xs text-slate-400">কোনো সফল ওটিপি নেই।</p></div>`;
                return;
            }

            let html = `
                <div class="space-y-3 pb-6">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="text-xs font-extrabold text-amber-400 uppercase"><i class="fa-solid fa-key mr-1"></i> SUCCESSFUL OTPs (${myOtps.length})</h3>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="clearMyOtpHistory()" class="text-[10px] c-rose px-2.5 py-1 rounded-lg text-white font-bold shadow"><i class="fa-solid fa-trash-can mr-1"></i>Clear History</button>
                            <button onclick="renderActiveNumbersView()" class="text-[10px] c-blue px-2.5 py-1 rounded-lg text-white font-bold">Back</button>
                        </div>
                    </div>
            `;
            myOtps.slice().reverse().forEach((item, index) => {
                let cInfo = getCountryInfo(item.countryCode || item.number || item.range);
                let serialNo = myOtps.length - index;
                html += `<div class="glass-panel rounded-2xl p-4 space-y-3 shadow-xl border-l-4 border-amber-400 relative"><div class="flex justify-between items-center text-xs"><span class="font-black text-amber-300 bg-amber-950/60 px-2.5 py-0.5 rounded-full">#${serialNo} &bull; ${cInfo.flag} ${cInfo.name}</span><span class="text-[10px] text-slate-400 font-mono">${item.time || ''}</span></div><div onclick="copyText('${item.number}', 'Number')" class="cursor-pointer active:scale-95 transition-all text-base font-mono font-extrabold text-white bg-slate-900 p-3 rounded-xl text-center border border-slate-800">📞 ${item.number} (${item.service})</div><div onclick="copyText('${item.otp}', 'OTP Code')" class="cursor-pointer active:scale-95 transition-all c-green p-3 rounded-xl text-center shadow-lg"><div class="text-[10px] text-emerald-100 uppercase font-bold flex justify-between px-2"><span>Tap to Copy OTP</span><span class="text-yellow-300 font-mono">+৳${globalSettings.otpRate}</span></div><div class="text-2xl font-mono font-black text-white tracking-widest mt-0.5">🔑 ${item.otp}</div></div></div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        async function clearMyOtpHistory() {
            if (confirm("⚠️ সতর্কতা!\n\nআপনি কি নিশ্চিতভাবে আপনার সমস্ত সেভ করা MY OTP হিস্ট্রি মুছে ফেলতে চান? এটি একবার মুছে ফেললে আর ফিরিয়ে আনা যাবে না।")) {
                userCloudData.successOtps = [];
                await syncUserToFirebase();
                updateOtpBadge();
                showToast("🗑️ MY OTP হিস্ট্রি ক্লিয়ার করা হয়েছে!");
                renderMyOtpView();
            }
        }

        async function clearHistory() {
            if (confirm("অ্যাক্টিভ নাম্বারগুলো মুছে ফেলতে চান?")) { userCloudData.activeNumbers = []; await syncUserToFirebase(); renderActiveNumbersView(); }
        }

        // ==================== LIVE 1-SECOND COUNTDOWN & 25-MIN AUTO EXPIRY ====================
        async function checkNumberExpirationAndTimers() {
            if (!currentUser) return;
            const now = Date.now();

            document.querySelectorAll('.num-timer-badge').forEach(badge => {
                const exp = parseInt(badge.getAttribute('data-expires')) || 0;
                const rem = exp - now;
                badge.innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${formatRemainingTime(rem)}`;
            });

            let activeNums = userCloudData.activeNumbers || [];
            if (activeNums.length > 0) {
                const validNums = activeNums.filter(item => {
                    const exp = item.expiresAt || ((item.createdAt || item.id) + NUMBER_VALIDITY_MS);
                    return exp > now;
                });

                if (validNums.length !== activeNums.length) {
                    userCloudData.activeNumbers = validNums;
                    await syncUserToFirebase();
                    const container = document.getElementById('screenContainer');
                    if (container && container.innerHTML.includes("ACTIVE NUMBERS")) {
                        renderActiveNumbersView();
                    }
                }
            }
        }

        // ==================== SILENT BACKGROUND OTP POLLING (SL PANEL + DATABASE SYNC) ====================
        async function pollOtps() {
            if (!currentUser) return;
            try {
                const now = Date.now();
                let activeNums = (userCloudData.activeNumbers || []).filter(item => {
                    const exp = item.expiresAt || ((item.createdAt || item.id) + NUMBER_VALIDITY_MS);
                    return exp > now;
                });

                if (activeNums.length === 0) return;

                let allSms = [];
                try {
                    const monitorHits = await fetchMonitorHits();
                    if (Array.isArray(monitorHits)) allSms = allSms.concat(monitorHits);
                } catch (e) {}

                for (const act of activeNums) {
                    if (!act.otp && act.rentalId) {
                        try {
                            const r = await fetch(`${CHECK_OTP_API}/${encodeURIComponent(act.rentalId)}`, { headers: slHeaders() });
                            const d = await r.json();
                            const dataObj = d && d.data ? d.data : d;
                            const directOtp = dataObj && (dataObj.otp || dataObj.code || extractOtpFromText(dataObj.message || dataObj.sms || ""));
                            if (directOtp) {
                                allSms.push({
                                    number: act.number,
                                    otp: directOtp,
                                    message: dataObj.message || dataObj.sms || `OTP: ${directOtp}`
                                });
                            }
                        } catch (e) {}
                    }
                }

                let successOtps = userCloudData.successOtps || [];
                let updated = false;

                for (const sms of allSms) {
                    let apiNum = sms.number ? String(sms.number).replace(/\D/g, "") : "";
                    let msg = sms.message || sms.sms || sms.text || "";
                    let code = sms.otp || sms.code || extractOtpFromText(msg);

                    if (code) {
                        code = String(code).trim();
                        for (const act of activeNums) {
                            let actClean = String(act.number || "").replace(/\D/g, "");
                            let numMatches = apiNum && actClean && (actClean.includes(apiNum) || apiNum.includes(actClean) || actClean.slice(-7) === apiNum.slice(-7));
                            if (numMatches && !act.otp) {
                                act.otp = code;
                                updated = true;

                                const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                                const alreadyExists = successOtps.some(h => h.number === act.number && h.otp === code);
                                if (!alreadyExists) {
                                    successOtps.push({
                                        id: 'otp_' + now,
                                        timestamp: now,
                                        number: act.number,
                                        countryCode: act.countryCode || "",
                                        service: act.service,
                                        range: act.range,
                                        otp: code,
                                        time: nowTime
                                    });
                                    userCloudData.successOtps = successOtps;
                                    userCloudData.stats.totalSuccessOtps = (userCloudData.stats.totalSuccessOtps || 0) + 1;
                                    userCloudData.stats.balance = (userCloudData.stats.balance || 0) + globalSettings.otpRate;
                                    updateOtpBadge();
                                }
                            }
                        }
                    }
                }

                if (updated) {
                    userCloudData.activeNumbers = activeNums;
                    await syncUserToFirebase();

                    const container = document.getElementById('screenContainer');
                    if (container && container.innerHTML.includes("ACTIVE NUMBERS")) {
                        renderActiveNumbersView();
                    }
                }
            } catch (e) {}
        }

        function openCustomRange() {
            const container = document.getElementById('screenContainer');
            const defTag = globalSettings.defaultTag || "SLVN-ETH-3";
            const defCountry = globalSettings.defaultCountry || "ET";
            container.innerHTML = `
                <div class="glass-panel rounded-2xl p-5 space-y-4 shadow-2xl border border-purple-500/40 pb-6">
                    <h3 class="text-xs font-extrabold text-purple-400 uppercase border-b border-slate-800 pb-2"><i class="fa-solid fa-keyboard mr-1"></i> CUSTOM RANGE / TAG</h3>
                    <div class="space-y-2">
                        <label class="text-xs text-slate-300 block">Enter Tag / Range:</label>
                        <input type="text" id="customRngInput" value="${defTag}" placeholder="${defTag}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white font-mono">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-slate-300 block">Country Code:</label>
                        <input type="text" id="customCountryInput" value="${defCountry}" placeholder="ET" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white uppercase font-mono">
                    </div>
                    <button onclick="buyCustomRange()" class="w-full py-3 c-purple active:scale-95 rounded-xl font-extrabold text-xs text-white shadow-lg">Generate Numbers</button>
                </div>
            `;
        }

        async function buyCustomRange() {
            let rng = document.getElementById('customRngInput').value.trim();
            let cCode = (document.getElementById('customCountryInput').value || globalSettings.defaultCountry || "ET").trim().toUpperCase();
            if (!rng) { showToast("⚠️ রেঞ্জ/ট্যাগ লিখুন!"); return; }
            await buyTwoNumbers(encodeURIComponent(rng), encodeURIComponent("Custom Range"), encodeURIComponent(cCode));
        }

        async function loadLiveTraffic() {
            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-emerald-400 mr-2"></i> লোড হচ্ছে...</div>`;

            try {
                let hits = await fetchMonitorHits();
                let html = `<div class="glass-panel rounded-2xl p-4 space-y-2.5 shadow-2xl border border-emerald-500/30 pb-6"><div class="flex justify-between items-center border-b border-slate-800 pb-2"><h3 class="text-xs font-extrabold text-emerald-400 uppercase"><i class="fa-solid fa-satellite-dish mr-1"></i> LIVE TRAFFIC</h3><button onclick="loadLiveTraffic()" class="text-[10px] c-sky px-2 py-0.5 rounded font-bold text-white">Refresh</button></div><div class="space-y-2.5">`;

                if (!hits || hits.length === 0) {
                    html += `<div class="p-4 bg-slate-900/90 border border-slate-800 rounded-xl text-center text-xs text-slate-400">কোনো লাইভ মেসেজ পাওয়া যায়নি।</div>`;
                } else {
                    hits.slice(-25).reverse().forEach(hit => {
                        let cCode = (hit.countryCode || hit.country_code || globalSettings.defaultCountry || "ET").toString().toUpperCase();
                        let cInfo = getCountryInfo(cCode || hit.range || hit.tag);
                        let serviceName = (hit.service || hit.sid || "SMS").toString().toUpperCase();
                        let rawRange = hit.tag || hit.range || globalSettings.defaultTag || "SLVN-ETH-3";
                        let rawMessage = hit.message || hit.sms || hit.text || JSON.stringify(hit);

                        html += `<div class="p-3 bg-slate-900/90 border border-slate-800 rounded-xl space-y-2"><div class="flex justify-between items-center font-bold text-white"><span>${cInfo.flag} ${cInfo.name} (${cInfo.short})</span><span class="c-blue text-white font-mono text-[10px] px-2 py-0.5 rounded-full font-extrabold">${serviceName}</span></div><div class="flex justify-between items-center bg-black/40 p-2 rounded border border-slate-800/80"><span class="text-amber-400 font-mono text-[11px]">Tag: <b>${rawRange}</b></span><button onclick="buyTwoNumbers('${encodeURIComponent(rawRange)}', '${encodeURIComponent(serviceName)}', '${encodeURIComponent(cCode)}')" class="px-2.5 py-1 c-green text-white text-[10px] font-extrabold rounded-lg shadow">Get Number</button></div><div class="text-[11px] text-emerald-300 font-mono bg-black/50 p-2.5 rounded-lg border border-slate-800 break-words leading-relaxed">${rawMessage}</div></div>`;
                    });
                }
                html += `</div></div>`;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400">লোড করতে সমস্যা হয়েছে!</div>`;
            }
        }

        // Background Intervals
        setInterval(checkNumberExpirationAndTimers, 1000);
        setInterval(pollOtps, 1500);
    </script>
</body>
</html>
