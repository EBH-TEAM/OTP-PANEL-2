        const DIAL_TO_ISO = {
            "39": "IT", "855": "KH", "20": "EG", "509": "HT", "251": "ET", "880": "BD",

        function normalizeDigits(num) {
            return String(num || "").replace(/\D/g, "");
        }

        function stripTrailingDots(str) {
            return String(str || "").replace(/(\s*(\.{2,}|…)+\s*)+$/g, "").replace(/(\.{2,}|…)/g, "").trim();
        }

        function isoToFlagEmoji(code) {
            const c = String(code || "").trim().toUpperCase();
            if (c.length === 2 && /^[A-Z]{2}$/.test(c)) {
                return String.fromCodePoint(127397 + c.charCodeAt(0), 127397 + c.charCodeAt(1));
            }
            return "";
        }

        function findAnyStringByKeys(obj, keyList, depth = 0) {
            if (!obj || typeof obj !== "object" || depth > 4) return "";
            for (const k of keyList) {
                if (typeof obj[k] === "string" && obj[k].trim() !== "") {
                    return obj[k].trim();
                }
                if (typeof obj[k] === "number" && !Number.isNaN(obj[k])) {
                    return String(obj[k]);
                }
            }
            for (const val of Object.values(obj)) {
                if (val && typeof val === "object" && !Array.isArray(val)) {
                    const found = findAnyStringByKeys(val, keyList, depth + 1);
                    if (found) return found;
                }
            }
            return "";
        }

        function getDirectPhone(hit) {
            const keys = [
                "phoneNumber", "phone_number", "maskedPhone", "masked_phone",
                "number", "phone", "msisdn", "recipient", "dest", "destination",
                "to", "target", "line"
            ];
            let raw = findAnyStringByKeys(hit, keys);
            if (!raw) {
                const fullText = getDirectMessage(hit);
                const m = fullText.match(/(\+?\d[\d\s•*xX-]{5,18}\d)/);
                if (m) raw = m[1].trim();
            }
            return raw ? raw.trim() : "";
        }

        function getDirectMessage(hit) {
            if (!hit || typeof hit !== "object") return stripTrailingDots(hit);
            const keys = [
                "fullSms", "full_sms", "message", "sms", "text", "body",
                "content", "rawSnippet", "raw_snippet", "otpText", "otp_text", "msg"
            ];
            const found = findAnyStringByKeys(hit, keys);
            return stripTrailingDots(found);
        }

        function getDirectCountry(hit, phoneStr = "") {
            const keys = ["countryCode", "country_code", "iso", "isoCode", "iso_code", "country", "countryName", "country_name", "region"];
            const rawVal = findAnyStringByKeys(hit, keys);
            if (rawVal) {
                const upper = rawVal.toUpperCase().trim();
                if (WORLD_COUNTRIES[upper]) return upper;
                for (const [k, v] of Object.entries(WORLD_COUNTRIES)) {
                    if (v.name.toUpperCase() === upper) return k;
                }
                const twoLetter = upper.match(/\b([A-Z]{2})\b/);
                if (twoLetter && WORLD_COUNTRIES[twoLetter[1]]) return twoLetter[1];
                if (/^[A-Z]{2,3}$/.test(upper)) return upper;
            }

            const digits = normalizeDigits(phoneStr);
            if (digits) {
                for (const len of [3, 2, 1]) {
                    const prefix = digits.slice(0, len);
                    if (DIAL_TO_ISO[prefix]) return DIAL_TO_ISO[prefix];
                }
            }
            return "";
        }

        function getDirectService(hit) {
            const keys = ["service", "serviceName", "service_name", "senderCli", "sender_cli", "sender", "app", "platform", "provider", "cli"];
            return findAnyStringByKeys(hit, keys).toUpperCase();
        }

        function getCountryInfo(code) {
            const upper = String(code || "").toUpperCase().trim();
            if (WORLD_COUNTRIES[upper]) {
                return { flag: WORLD_COUNTRIES[upper].flag, name: WORLD_COUNTRIES[upper].name, short: upper };
            }
            for (const [k, v] of Object.entries(WORLD_COUNTRIES)) {
                if (v.name.toUpperCase() === upper) {
                    return { flag: v.flag, name: v.name, short: k };
                }
            }
            const fl = isoToFlagEmoji(upper);
            return { flag: fl || "", name: upper || "", short: upper || "" };
        }

        function formatConsoleTimeAgo(hit) {
            const rawTime = hit.timeAgo || hit.time_ago || hit.time || hit.timestamp || hit.createdAt || hit.created_at;
            if (!rawTime) return "just now";
            if (typeof rawTime === "string" && isNaN(Number(rawTime))) return rawTime;
            const ts = Number(rawTime) < 1e12 ? Number(rawTime) * 1000 : Number(rawTime);
            const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
            if (diffSec < 15) return "just now";
            if (diffSec < 60) return `${diffSec}s ago`;
            if (diffSec < 3600) return `${Math.floor(diffSec / 60)}m ago`;
            return `${Math.floor(diffSec / 3600)}h ago`;
        }

        function extractOtpFromText(text) {

        function extractListFlexible(rawJson, keys = ["data", "services", "countries", "hits", "messages", "otps", "logs", "items", "results", "console", "events", "stream", "records", "list"]) {
            if (!rawJson) return [];
            if (Array.isArray(rawJson)) return rawJson;
            if (typeof rawJson === "object") {
                for (const k of keys) {
                    if (Array.isArray(rawJson[k])) return rawJson[k];
                    if (rawJson[k] && typeof rawJson[k] === "object") {
                        for (const subK of keys) {
                            if (Array.isArray(rawJson[k][subK])) return rawJson[k][subK];
                        }
                    }
                }
            }
            return [];
        }

        function extractRentedNumber(resJson) {
            let d = (resJson && resJson.data) ? resJson.data : (resJson || {});
            if (Array.isArray(d) && d.length > 0) d = d[0];
            const rawNum = d.phoneNumber || d.number || d.phone || d.full_number || d.msisdn || "";
            return rawNum ? ("+" + String(rawNum).replace(/^\+/, "").trim()) : "";
        }

                `${EBH_OTP_MONITOR_API}?limit=${limit}&_t=${Date.now()}`
            ];
            for (const url of endpoints) {
                try {
                    const res = await fetch(url, { cache: "no-store", headers: ebhHeaders() });
                    if (res.ok) {
                        const json = await res.json();
                        const items = extractListFlexible(json);
                        if (items.length > 0) return items;
                    }
                } catch (e) {}
            }
            return [];
        }

        async function adminActionWithdraw(reqId, action) {
            const req = pendingWithdraws[reqId];
            if (!req) return;

            if (action === 'Confirm') {
                req.status = 'Confirmed';
                await sendTelegramBotMessage(req.userId, `✅ <b>EBH WITHDRAW CONFIRMED!</b>\n\nআপনার ৳${req.amount} উইথড্র রিকোয়েস্ট সফলভাবে কনফার্ম করা হয়েছে।`);
                showToast("✅ উইথড্র কনফার্ম করা হয়েছে!");
            } else {
                req.status = 'Cancelled';
                const uData = await fetchUserFromFirebase(req.userId);
                if (uData) {
                    if (!uData.stats) uData.stats = { totalNumbersTaken: 0, totalSuccessOtps: 0, balance: 0 };
                    uData.stats.balance = Number(uData.stats.balance || 0) + Number(req.amount || 0);
                    uData.balance = uData.stats.balance;
                    await fetch(`${FIREBASE_DB_URL}/users/${req.userId}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(uData)
                    });
                }
                await sendTelegramBotMessage(req.userId, `❌ <b>EBH WITHDRAW CANCELLED!</b>\n\nআপনার ৳${req.amount} উইথড্র রিকোয়েস্ট বাতিল করা হয়েছে এবং ব্যালেন্স রিফান্ড করা হয়েছে।`);

            delete pendingWithdraws[reqId];
            await syncWithdrawsToFirebase();
            renderAdminPanelView();

        async function fetchPanelServices() {
            const urls = [`${EBH_SERVICES_API}?service=any`, EBH_SERVICES_API];
            for (const url of urls) {
                try {
                    const res = await fetch(url, { headers: ebhHeaders() });
                    if (res.ok) {
                        const items = extractListFlexible(await res.json());
                        const list = [];
                        items.forEach(item => {
                            const srv = (typeof item === "object" && item !== null)
                                ? (item.service || item.name || item.code)
                                : String(item);
                            if (srv && !String(srv).toLowerCase().includes("any")) {
                                const cleanSrv = String(srv).trim();
                                if (cleanSrv && !list.includes(cleanSrv)) list.push(cleanSrv);
                            }
                        });
                        if (list.length > 0) return list;
                    }
                } catch (e) {}
            }
            return ["WhatsApp", "Telegram", "Facebook", "Google", "Instagram"];
        }

        async function fetchPanelCountries(service) {
            const urls = [`${EBH_COUNTRIES_API}?service=${encodeURIComponent(service)}`, EBH_COUNTRIES_API];
            for (const url of urls) {
                try {
                    const res = await fetch(url, { headers: ebhHeaders() });
                    if (res.ok) {
                        const items = extractListFlexible(await res.json());
                        const list = [];
                        items.forEach(item => {
                            const cc = (typeof item === "object" && item !== null)
                                ? (item.countryCode || item.code || item.country)
                                : String(item);
                            if (cc) {
                                const u = String(cc).toUpperCase().trim();
                                if (u && !list.includes(u)) list.push(u);
                            }
                        });
                        if (list.length > 0) return list;
                    }
                } catch (e) {}
            }
            return ["IT", "EG", "HT", "ET", "BD", "US", "RU", "GB", "DE", "ID", "PH", "NG", "IN"];
        }

        async function buyNumbers(encodedServiceTitle, encodedCountryCode) {
            isLiveConsoleActive = false;
            await fetchGlobalSettings();
            const serviceTitle = decodeURIComponent(encodedServiceTitle);
            const countryCode = decodeURIComponent(encodedCountryCode);

            lastSelectedService = serviceTitle;
            lastSelectedCountryCode = countryCode;

            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-xl text-emerald-400 mr-2"></i> EBH নতুন নাম্বার জেনারেট হচ্ছে...</div>`;

            let limit = parseInt(globalSettings.numberLimit || 3);
            if (limit < 1) limit = 3;

            let newFetchedNumbers = [];
            const nowTs = Date.now();

            for (let i = 0; i < limit; i++) {
                try {
                    const response = await fetch(EBH_RENT_API, {
                        method: "POST",
                        headers: ebhHeaders(),
                        body: JSON.stringify({ service: serviceTitle, countryCode: countryCode, country: countryCode })
                    });
                    const resData = await response.json();
                    const num = extractRentedNumber(resData);

                    if (num && !newFetchedNumbers.some(x => x.number === num)) {
                        const norm = normalizeDigits(num);
                        await registerActiveAssignmentInRTDB(norm, serviceTitle, countryCode, num);

                        newFetchedNumbers.push({
                            id: nowTs + i,
                            number: num,
                            countryCode: countryCode,
                            service: serviceTitle,
                            range: `EBH-${countryCode}`,
                            otp: null,
                            createdAt: nowTs,
                            expiresAt: nowTs + NUMBER_VALIDITY_MS
                        });
                    }
                } catch (e) {}
            }

            if (newFetchedNumbers.length > 0) {
                // Replace old numbers with new numbers completely
                userCloudData.activeNumbers = newFetchedNumbers;
                userCloudData.stats.totalNumbersTaken = Number(userCloudData.stats.totalNumbersTaken || 0) + newFetchedNumbers.length;
                await syncUserToFirebase();
                renderActiveNumbersView();
            } else {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400 font-bold">এই কান্ট্রিতে নাম্বার খালি নেই!</div>`;
            }
        }

        function formatRemainingTime(ms) {
            if (ms <= 0) return "00:00";
            const totalSecs = Math.floor(ms / 1000);
            const mins = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            const secs = (totalSecs % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        async function checkNumberExpirationAndTimers() {
            if (!currentUser) return;
            const now = Date.now();
            const beforeLen = (userCloudData.activeNumbers || []).length;
            const validList = filterValidActiveNumbers(userCloudData.activeNumbers);

            if (validList.length !== beforeLen) {
                userCloudData.activeNumbers = validList;
                await syncUserToFirebase();
                const container = document.getElementById('screenContainer');
                if (container && container.innerHTML.includes("EBH ACTIVE NUMBERS")) {
                    renderActiveNumbersView();
                    return;
                }
            }

            document.querySelectorAll('.num-timer-badge').forEach(badge => {
                const exp = parseInt(badge.getAttribute('data-expires')) || 0;
                const rem = exp - now;
                badge.innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${formatRemainingTime(rem)}`;
            });
        }

        async function pollOtps() {
            if (!currentUser) return;
            try {
                await fetchGlobalSettings();
                const latestCloud = await fetchUserFromFirebase(currentUser.id);
                if (latestCloud) {
                    const s = latestCloud.stats || {};
                    userCloudData.stats.totalNumbersTaken = Math.max(Number(userCloudData.stats.totalNumbersTaken || 0), Number(s.totalNumbersTaken ?? latestCloud.total_numbers ?? 0));
                    userCloudData.stats.totalSuccessOtps = Math.max(Number(userCloudData.stats.totalSuccessOtps || 0), Number(s.totalSuccessOtps ?? latestCloud.successful_otps ?? 0));
                    userCloudData.stats.balance = Math.max(Number(userCloudData.stats.balance || 0), Number(s.balance ?? latestCloud.balance ?? 0));
                    if (Array.isArray(latestCloud.successOtps)) userCloudData.successOtps = latestCloud.successOtps;
                    if (Array.isArray(latestCloud.activeNumbers)) {
                        userCloudData.activeNumbers = filterValidActiveNumbers(latestCloud.activeNumbers);
                    }
                    updateOtpBadge();
                }

                const allSms = await fetchLiveConsoleHits(50);

                if (allSms.length > 0) {
                    const sig = JSON.stringify(allSms.map(h => [
                        getDirectPhone(h),
                        getDirectMessage(h),
                        getDirectService(h),
                        getDirectCountry(h, getDirectPhone(h))
                    ]));

                    if (sig !== lastLiveConsoleSignature) {
                        lastLiveConsoleSignature = sig;
                        lastLiveConsoleHits = allSms;
                        if (isLiveConsoleActive && !liveConsolePaused) {
                            renderLiveConsoleView(lastLiveConsoleHits);
                        }
                    }
                }

                const activeNums = filterValidActiveNumbers(userCloudData.activeNumbers);
                if (activeNums.length === 0) return;

                let updated = false;
                const rateAmount = Number(globalSettings.otpRate || 5);

                for (const sms of allSms) {
                    const apiNum = normalizeDigits(getDirectPhone(sms));
                    const msg = getDirectMessage(sms);
                    const code = String(sms.otp || sms.otpCode || sms.code || extractOtpFromText(msg) || "").trim();

                    if (code && apiNum) {
                        for (const act of activeNums) {
                            const actClean = normalizeDigits(act.number || "");
                            if (actClean && (actClean === apiNum || actClean.endsWith(apiNum) || apiNum.endsWith(actClean)) && !act.otp) {
                                act.otp = code;
                                updated = true;

                                const resolvedService = getDirectService(sms) || act.service || "SMS";
                                const resolvedCountry = act.countryCode || getDirectCountry(sms, act.number);

                                const alreadyExists = (userCloudData.successOtps || []).some(h => h.number === act.number && String(h.otp) === code);
                                if (!alreadyExists) {
                                    userCloudData.stats.totalSuccessOtps = Number(userCloudData.stats.totalSuccessOtps || 0) + 1;
                                    userCloudData.stats.balance = Number((Number(userCloudData.stats.balance || 0) + rateAmount).toFixed(2));
                                    userCloudData.successOtps.push({
                                        id: 'otp_' + Date.now(),
                                        timestamp: Date.now(),
                                        number: act.number,
                                        countryCode: resolvedCountry,
                                        service: resolvedService,
                                        otp: code,
                                        rate: rateAmount,
                                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                                    });
                                }
                            }
                        }
                    }
                }

                if (updated) {
                    userCloudData.activeNumbers = activeNums;
                    await syncUserToFirebase();
                    updateOtpBadge();
                    const container = document.getElementById('screenContainer');
                    if (container && container.innerHTML.includes("EBH ACTIVE NUMBERS")) {
                        renderActiveNumbersView();
                    }
                }
            } catch (e) {}
        }

        setInterval(pollOtps, 2000);
