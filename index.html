    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] hidden px-4 py-2 rounded-full c-green text-white text-xs font-bold shadow-2xl transition-all">
        Copied!
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-[#060913] flex flex-col items-center justify-center p-4 hidden">
        <div class="w-full max-w-sm glass-panel rounded-3xl p-6 space-y-5 shadow-2xl border border-blue-500/30">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 c-blue rounded-2xl mx-auto flex items-center justify-center text-2xl text-white shadow-lg">
                    <i class="fa-brands fa-telegram"></i>
                </div>
                <h2 class="text-lg font-extrabold text-white">EBH BROWSER LOGIN</h2>
                <p class="text-xs text-slate-400">ব্রাউজারে ঢুকতে আপনার Telegram Chat ID দিন:</p>
            </div>
            <div id="loginStep1" class="space-y-3">
                <div>
                    <label class="text-[11px] font-bold text-slate-300 block mb-1">Telegram Chat ID:</label>
                    <input type="number" id="loginChatId" placeholder="e.g. 6140196943" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white font-mono focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="checkAndSendLoginOtp()" id="sendCodeBtn" class="w-full py-3 c-blue active:scale-95 rounded-xl font-extrabold text-xs text-white transition-all">
                    CHECK & SEND OTP
                </button>
            </div>
            <div id="loginStep2" class="space-y-3 hidden">
                <div>
                    <label class="text-[11px] font-bold text-emerald-400 block mb-1">Enter 6-Digit Code from Telegram:</label>
                    <input type="number" id="loginOtpInput" placeholder="123456" class="w-full bg-slate-900 border border-emerald-600 rounded-xl p-3 text-center text-lg tracking-widest text-white font-mono focus:outline-none">
                </div>
                <button onclick="verifyLoginOtp()" class="w-full py-3 c-green active:scale-95 rounded-xl font-extrabold text-xs text-white transition-all">
                    VERIFY & LOGIN
                </button>
                <button onclick="resetLoginStep()" class="w-full py-2 text-[11px] text-slate-400 hover:text-white">Change Chat ID</button>
            </div>
        </div>
    </div>

    <!-- User Header -->
    <header id="userHeader" class="w-full max-w-md mx-auto p-3 pb-1 hidden z-20 flex-shrink-0">
        <div class="glass-panel rounded-2xl p-3.5 flex items-center justify-between shadow-lg">
            <div onclick="renderUserProfileView()" class="flex items-center space-x-2.5 cursor-pointer group active:scale-95 transition-all" title="View Full Profile & Wallet">
                <div class="relative">
                    <img id="userAvatar" src="https://ui-avatars.com/api/?name=EBH&background=2563eb&color=fff" alt="Profile" class="w-10 h-10 rounded-xl object-cover border border-blue-400/50 shadow group-hover:border-amber-400 transition-all">
                    <span class="absolute -bottom-1 -right-1 w-3 h-3 bg-emerald-500 border-2 border-[#060913] rounded-full"></span>
                </div>
                <div>
                    <h2 id="userDisplayName" class="text-xs font-extrabold text-white group-hover:text-sky-400 transition-colors flex items-center">
                        <span id="headerNameText">EBH User</span>
                        <i class="fa-solid fa-circle-info text-[10px] text-sky-400 ml-1"></i>
                    </h2>
                    <p class="text-[10px] text-emerald-400 font-mono font-bold">Balance: ৳<span id="userBalanceDisplay">0.00</span></p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="renderMyOtpView()" class="px-4 py-2 c-amber rounded-2xl text-xs font-black text-white shadow-xl flex items-center space-x-1.5 active:scale-95 transition-all">
                    <i class="fa-solid fa-key text-xs"></i>
                    <span>MY OTP (<span id="otpCountBadge">0</span>)</span>
                </button>
                <button id="logoutBtn" onclick="logoutUser()" class="hidden text-xs c-rose text-white px-2.5 py-2 rounded-xl font-bold" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="screenContainer" class="w-full max-w-md mx-auto flex-1 overflow-y-auto p-3 pb-24 space-y-3 hidden">
    </main>

        function isoToFlagEmoji(code) {
            const c = String(code || "").trim().toUpperCase();
            if (c.length === 2 && /^[A-Z]{2}$/.test(c)) {
                return String.fromCodePoint(127397 + c.charCodeAt(0), 127397 + c.charCodeAt(1));
            }
            return "🌍";
        }

        function getCountryInfo(code) {
            let upper = String(code || "").toUpperCase().trim();
            if (upper.length === 3 && upper.endsWith("A") && WORLD_COUNTRIES[upper.slice(0, 2)]) {
                upper = upper.slice(0, 2);
            }
            if (WORLD_COUNTRIES[upper]) {
                return { flag: WORLD_COUNTRIES[upper].flag, name: WORLD_COUNTRIES[upper].name, short: upper };
            }
            for (const [k, v] of Object.entries(WORLD_COUNTRIES)) {
                if (v.name.toUpperCase() === upper) {
                    return { flag: v.flag, name: v.name, short: k };
                }
            }
            return { flag: isoToFlagEmoji(upper), name: upper || "Global", short: upper || "GL" };
        }

        function extractListFlexible(rawJson, keys = ["data", "services", "countries", "hits", "messages", "otps", "logs", "items", "results"]) {
            if (!rawJson) return [];
            if (Array.isArray(rawJson)) return rawJson;
            if (typeof rawJson === "object") {
                for (const k of keys) {
                    if (Array.isArray(rawJson[k])) return rawJson[k];
                    if (rawJson[k] && typeof rawJson[k] === "object") {
                        for (const subK of keys) {
                            if (Array.isArray(rawJson[k][subK])) return rawJson[k][subK];
                        }
                    }
                }
            }
            return [];
        }

        function extractRentedNumber(resJson) {
            let d = (resJson && resJson.data) ? resJson.data : (resJson || {});
            if (Array.isArray(d) && d.length > 0) d = d[0];
            const rawNum = d.phoneNumber || d.number || d.phone || d.full_number || d.msisdn || "";
            return rawNum ? ("+" + String(rawNum).replace(/^\+/, "").trim()) : "";
        }

        async function initializeCloudSession() {
            let fetchedPhoto = currentUser.photo;
            const tgPic = await fetchTelegramProfilePhoto(currentUser.id);
            if (tgPic) fetchedPhoto = tgPic;
            currentUser.photo = fetchedPhoto;

            const existingCloud = await fetchUserFromFirebase(currentUser.id);
            if (existingCloud) {
                const p = existingCloud.profile || {};
                const s = existingCloud.stats || {};
                userCloudData = {
                    profile: {
                        name: (currentUser.isMiniApp && currentUser.name) ? currentUser.name : (p.name || existingCloud.name || currentUser.name),
                        username: (currentUser.isMiniApp && currentUser.username) ? currentUser.username : (p.username || existingCloud.username || "@EBHUser"),
                        photo: fetchedPhoto || p.photo || existingCloud.photo || "",
                        joinedAt: p.joinedAt || existingCloud.joined_at || new Date().toLocaleDateString()
                    },
                    stats: {
                        totalNumbersTaken: Number(s.totalNumbersTaken ?? existingCloud.total_numbers ?? 0),
                        totalSuccessOtps: Number(s.totalSuccessOtps ?? existingCloud.successful_otps ?? 0),
                        balance: Number(s.balance ?? existingCloud.balance ?? 0.00)
                    },
                    activeNumbers: Array.isArray(existingCloud.activeNumbers) ? existingCloud.activeNumbers : [],
                    successOtps: Array.isArray(existingCloud.successOtps) ? existingCloud.successOtps : [],
                    processed_numbers: Array.isArray(existingCloud.processed_numbers) ? existingCloud.processed_numbers : []
                };

                currentUser.name = userCloudData.profile.name;
                currentUser.username = userCloudData.profile.username;

                const now = Date.now();
                userCloudData.activeNumbers = userCloudData.activeNumbers.filter(item => {
                    const exp = item.expiresAt || ((item.createdAt || item.id || now) + NUMBER_VALIDITY_MS);
                    return exp > now;
                });

                await syncUserToFirebase();
            } else {
                if (!currentUser.isMiniApp) {
                    document.getElementById('loginScreen').classList.remove('hidden');
                    showToast("⚠️ আগে টেলিগ্রাম বট বা মিনি অ্যাপ ওপেন করুন!");
                    return;
                }
                userCloudData = {
                    profile: { name: currentUser.name, username: currentUser.username || "@EBHUser", photo: fetchedPhoto, joinedAt: new Date().toLocaleDateString() },
                    stats: { totalNumbersTaken: 0, totalSuccessOtps: 0, balance: 0.00 },
                    activeNumbers: [],
                    successOtps: [],
                    processed_numbers: []
                };
                await syncUserToFirebase();
            }
            unlockApp();
        }

        async function sendWithdrawOtpRequest() {
            const method = document.getElementById('wMethod').value;
            const account = document.getElementById('wAccount').value.trim();
            const amount = parseFloat(document.getElementById('wAmount').value);
            const balance = userCloudData.stats.balance || 0;

            if (!account) { showToast("⚠️ একাউন্ট নাম্বার দিন!"); return; }
            if (isNaN(amount) || amount < globalSettings.minWithdraw) { showToast(`⚠️ সর্বনিম্ন উইথড্র ৳${globalSettings.minWithdraw}!`); return; }
            if (amount > balance) { showToast("⚠️ পর্যাপ্ত ব্যালেন্স নেই!"); return; }

            pendingWithdrawOtp = Math.floor(100000 + Math.random() * 900000).toString();
            pendingWithdrawDetails = { method, account, amount, time: new Date().toLocaleString() };

            const res = await sendTelegramBotMessage(currentUser.id, `🔐 <b>EBH WITHDRAW CONFIRMATION OTP</b>\n\n<blockquote>🔑 Code: <code>${pendingWithdrawOtp}</code></blockquote>`);
            if (res && res.ok) {
                renderWithdrawVerifyView();
                showToast("✅ টেলিগ্রামে কনফার্মেশন কোড পাঠানো হয়েছে!");
            } else {
                showToast("❌ কোড পাঠানো যায়নি! বট স্টার্ট করা আছে কিনা চেক করুন।");
            }
        }

        async function adminActionWithdraw(reqId, action) {
            const req = pendingWithdraws[reqId];
            if (!req) return;

            if (action === 'Confirm') {
                req.status = 'Confirmed';
                await sendTelegramBotMessage(req.userId, `✅ <b>EBH WITHDRAW CONFIRMED!</b>\n\nআপনার ৳${req.amount} উইথড্র রিকোয়েস্ট সফলভাবে কনফার্ম করা হয়েছে।`);
                showToast("✅ উইথড্র কনফার্ম করা হয়েছে!");
            } else {
                req.status = 'Cancelled';
                const uData = await fetchUserFromFirebase(req.userId);
                if (uData) {
                    if (!uData.stats) uData.stats = { totalNumbersTaken: 0, totalSuccessOtps: 0, balance: 0 };
                    uData.stats.balance = Number(uData.stats.balance || 0) + Number(req.amount || 0);
                    uData.balance = uData.stats.balance;
                    await fetch(`${FIREBASE_DB_URL}/users/${req.userId}.json`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(uData)
                    });
                }
                await sendTelegramBotMessage(req.userId, `❌ <b>EBH WITHDRAW CANCELLED!</b>\n\nআপনার ৳${req.amount} উইথড্র রিকোয়েস্ট বাতিল করা হয়েছে এবং ব্যালেন্স রিফান্ড করা হয়েছে।`);

        async function fetchPanelServices() {
            const urls = [`${EBH_SERVICES_API}?service=any`, EBH_SERVICES_API];
            for (const url of urls) {
                try {
                    const res = await fetch(url, { headers: ebhHeaders() });
                    if (res.ok) {
                        const items = extractListFlexible(await res.json());
                        const list = [];
                        items.forEach(item => {
                            const srv = (typeof item === "object" && item !== null)
                                ? (item.service || item.name || item.code)
                                : String(item);
                            if (srv && !String(srv).toLowerCase().includes("any")) {
                                const cleanSrv = String(srv).trim();
                                if (cleanSrv && !list.includes(cleanSrv)) list.push(cleanSrv);
                            }
                        });
                        if (list.length > 0) return list;
                    }
                } catch (e) {}
            }
            return ["WhatsApp", "Telegram", "Facebook", "Google", "Instagram"];
        }

                    const res = await fetch(url, { headers: ebhHeaders() });
                    if (res.ok) {
                        const items = extractListFlexible(await res.json());
                        const list = [];
                        items.forEach(item => {
                            const cc = (typeof item === "object" && item !== null)
                                ? (item.countryCode || item.code || item.country)
                                : String(item);
                            if (cc) {
                                const u = String(cc).toUpperCase().trim();
                                if (u && !list.includes(u)) list.push(u);
                            }
                        });
                        if (list.length > 0) return list;
                    }
                } catch (e) {}
            }
            return ["IT", "EG", "HT", "ET", "BD", "US", "RU", "GB", "DE", "ID", "PH", "NG", "IN"];
        }

        async function loadServices() {
            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-xl text-sky-400 mr-2"></i> EBH সার্ভিস লোড হচ্ছে...</div>`;

            const services = await fetchPanelServices();
            let html = `
                <div class="glass-panel rounded-2xl p-4 space-y-3 shadow-2xl pb-6">
                    <h3 class="text-xs font-extrabold text-sky-400 uppercase border-b border-slate-800 pb-2">SELECT EBH SERVICE</h3>
                    <div class="grid grid-cols-2 gap-2.5">
            `;
            services.slice(0, 18).forEach((srv, idx) => {
                let iconClass = getServiceIcon(srv);
                html += `
                    <button onclick="loadCountriesForService('${encodeURIComponent(srv)}')" class="p-3.5 ${getRandomColor(idx)} active:scale-95 rounded-xl text-xs font-extrabold text-white text-center shadow-md flex items-center justify-center space-x-2">
                        <i class="${iconClass} text-sm"></i>
                        <span class="truncate">${srv}</span>
                    </button>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        async function loadCountriesForService(encodedServiceName) {
            const serviceName = decodeURIComponent(encodedServiceName);
            lastSelectedService = serviceName;

            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-xl text-amber-400 mr-2"></i> ${serviceName} এর কান্ট্রি লোড হচ্ছে...</div>`;

            const countries = await fetchPanelCountries(serviceName);
            let html = `
                <div class="glass-panel rounded-2xl p-4 space-y-3 shadow-2xl pb-6">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <h3 class="text-xs font-extrabold text-amber-400 uppercase truncate">${serviceName} - COUNTRIES</h3>
                        <button onclick="loadServices()" class="text-[10px] font-bold text-white c-rose px-2.5 py-1 rounded-lg">Back</button>
                    </div>
                    <div class="space-y-2">
            `;
            countries.forEach((cCode, idx) => {
                let cInfo = getCountryInfo(cCode);
                html += `
                    <div onclick="buyNumbers('${encodeURIComponent(serviceName)}', '${encodeURIComponent(cCode)}')" class="p-3 ${getRandomColor(idx + 1)} active:scale-95 rounded-xl flex items-center justify-between cursor-pointer shadow-md">
                        <span class="text-xs font-extrabold text-white truncate">${cInfo.flag} ${cInfo.name} (${cInfo.short})</span>
                        <span class="text-[10px] font-mono text-white bg-black/30 px-2.5 py-1 rounded-lg font-bold flex-shrink-0 ml-2">Get ${globalSettings.numberLimit || 3}</span>
                    </div>
                `;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        async function buyNumbers(encodedServiceTitle, encodedCountryCode) {
            const serviceTitle = decodeURIComponent(encodedServiceTitle);
            const countryCode = decodeURIComponent(encodedCountryCode);

            lastSelectedService = serviceTitle;
            lastSelectedCountryCode = countryCode;

            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-xl text-emerald-400 mr-2"></i> EBH নাম্বার জেনারেট হচ্ছে...</div>`;

            let limit = parseInt(globalSettings.numberLimit || 3);
            if (limit < 1) limit = 3;

            let newFetchedNumbers = [];
            const nowTs = Date.now();

            for (let i = 0; i < limit; i++) {
                try {
                    const response = await fetch(EBH_RENT_API, {
                        method: "POST",
                        headers: ebhHeaders(),
                        body: JSON.stringify({ service: serviceTitle, countryCode: countryCode, country: countryCode })
                    });
                    const resData = await response.json();
                    const num = extractRentedNumber(resData);

                    if (num && !newFetchedNumbers.some(x => x.number === num)) {
                        const norm = normalizeDigits(num);
                        await registerActiveAssignmentInRTDB(norm, serviceTitle, countryCode, num);

                        newFetchedNumbers.push({
                            id: nowTs + i,
                            number: num,
                            countryCode: countryCode,
                            service: serviceTitle,
                            range: `EBH-${countryCode}`,
                            otp: null,
                            createdAt: nowTs,
                            expiresAt: nowTs + NUMBER_VALIDITY_MS
                        });
                    }
                } catch (e) {}
            }

            if (newFetchedNumbers.length > 0) {
                userCloudData.activeNumbers = newFetchedNumbers;
                userCloudData.stats.totalNumbersTaken = Number(userCloudData.stats.totalNumbersTaken || 0) + newFetchedNumbers.length;
                await syncUserToFirebase();
                renderActiveNumbersView();
            } else {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400 font-bold">এই কান্ট্রিতে নাম্বার খালি নেই!</div>`;
            }
        }

        function formatRemainingTime(ms) {
            if (ms <= 0) return "00:00";
            const totalSecs = Math.floor(ms / 1000);
            const mins = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            const secs = (totalSecs % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function renderActiveNumbersView() {
            const container = document.getElementById('screenContainer');
            const now = Date.now();
            const myNums = (userCloudData.activeNumbers || []).filter(item => {
                const exp = item.expiresAt || ((item.createdAt || item.id || now) + NUMBER_VALIDITY_MS);
                return exp > now;
            });

            if (myNums.length === 0) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center space-y-3 shadow-xl"><div class="w-12 h-12 c-blue text-white rounded-2xl mx-auto flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-satellite-dish"></i></div><h1 class="text-base font-extrabold text-white">EBH SMS CLOUD PANEL</h1><p class="text-xs text-slate-400">GET NUMBER এ ক্লিক করে সার্ভিস ও কান্ট্রি বেছে নাম্বার নিন।</p></div>`;
                return;
            }

            let html = `<div class="space-y-3 pb-6"><div class="flex justify-between items-center px-1"><h3 class="text-xs font-extrabold text-emerald-400 uppercase">📦 EBH ACTIVE NUMBERS</h3><button onclick="clearHistory()" class="text-[10px] c-rose px-2.5 py-1 rounded-lg text-white font-bold">Clear</button></div>`;
            myNums.forEach(item => {
                let cInfo = getCountryInfo(item.countryCode);
                const exp = item.expiresAt || ((item.createdAt || item.id || now) + NUMBER_VALIDITY_MS);
                const remStr = formatRemainingTime(exp - now);

                html += `
                    <div class="glass-panel rounded-2xl p-4 space-y-3 shadow-xl border-l-4 ${item.otp ? 'border-emerald-400' : 'border-sky-400'}">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-extrabold text-white">${cInfo.flag} ${cInfo.name} (${cInfo.short})</span>
                            <div class="flex items-center space-x-1.5">
                                <span data-expires="${exp}" class="num-timer-badge text-[10px] bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded font-mono font-bold"><i class="fa-regular fa-clock mr-1"></i>${remStr}</span>
                                <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-mono font-bold">+৳${globalSettings.otpRate}</span>
                                <span class="c-purple px-2 py-0.5 rounded-full text-[10px] text-white font-bold truncate max-w-[90px]">${item.service}</span>
                            </div>
                        </div>
                        <div onclick="copyText('${item.number}', 'Number')" class="cursor-pointer active:scale-95 transition-all text-lg font-mono font-black text-white c-sky p-3.5 rounded-xl text-center shadow-md select-all">
                            📞 ${item.number}
                        </div>
                        ${item.otp ? `
                            <div onclick="copyText('${item.otp}', 'OTP Code')" class="cursor-pointer active:scale-95 transition-all c-green p-3 rounded-xl text-center shadow-lg">
                                <div class="text-[10px] text-emerald-100 uppercase font-bold flex justify-between px-2">
                                    <span>Tap to Copy OTP</span>
                                    <span class="text-yellow-300 font-mono">+৳${globalSettings.otpRate} Added</span>
                                </div>
                                <div class="text-2xl font-mono font-black text-white tracking-widest mt-0.5">🔑 ${item.otp}</div>
                            </div>
                        ` : `
                            <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl text-center text-xs font-bold text-amber-400 animate-pulse">
                                ⌛ Waiting for incoming OTP... (Sent to Telegram Inbox too)
                            </div>
                        `}
                    </div>
                `;
            });

            if (lastSelectedService && lastSelectedCountryCode) {
                html += `<div class="pt-1"><button onclick="buyNumbers('${encodeURIComponent(lastSelectedService)}', '${encodeURIComponent(lastSelectedCountryCode)}')" class="w-full py-4 c-next-btn active:scale-95 rounded-2xl font-black text-sm text-white transition-all flex items-center justify-center space-x-2"><i class="fa-solid fa-arrows-rotate text-base"></i><span>NEXT NUMBERS (${globalSettings.numberLimit}) &bull; [${lastSelectedService}]</span></button></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderMyOtpView() {
            const container = document.getElementById('screenContainer');
            const myOtps = userCloudData.successOtps || [];

            if (myOtps.length === 0) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center space-y-3 shadow-xl border border-amber-500/30"><div class="w-12 h-12 c-amber text-white rounded-2xl mx-auto flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-key"></i></div><h1 class="text-base font-extrabold text-white">EBH MY OTP INBOX</h1><p class="text-xs text-slate-400">কোনো সফল ওটিপি নেই।</p></div>`;
                return;
            }

            let html = `
                <div class="space-y-3 pb-6">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="text-xs font-extrabold text-amber-400 uppercase"><i class="fa-solid fa-key mr-1"></i> SUCCESSFUL OTPs (${myOtps.length})</h3>
                        <button onclick="renderActiveNumbersView()" class="text-[10px] c-blue px-2.5 py-1 rounded-lg text-white font-bold">Back</button>
                    </div>
            `;
            myOtps.slice().reverse().forEach((item, index) => {
                let serialNo = myOtps.length - index;
                html += `<div class="glass-panel rounded-2xl p-4 space-y-3 shadow-xl border-l-4 border-amber-400"><div class="flex justify-between items-center text-xs"><span class="font-black text-amber-300 bg-amber-950/60 px-2.5 py-0.5 rounded-full">#${serialNo} &bull; ${item.service || 'SMS'}</span><span class="text-[10px] text-slate-400 font-mono">${item.time || ''}</span></div><div onclick="copyText('${item.number}', 'Number')" class="cursor-pointer active:scale-95 transition-all text-base font-mono font-extrabold text-white bg-slate-900 p-3 rounded-xl text-center border border-slate-800">📞 ${item.number}</div><div onclick="copyText('${item.otp}', 'OTP Code')" class="cursor-pointer active:scale-95 transition-all c-green p-3 rounded-xl text-center shadow-lg"><div class="text-2xl font-mono font-black text-white tracking-widest">🔑 ${item.otp}</div></div></div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        async function clearHistory() {
            if (confirm("অ্যাক্টিভ নাম্বারগুলো মুছে ফেলতে চান?")) {
                userCloudData.activeNumbers = [];
                await syncUserToFirebase();
                renderActiveNumbersView();
            }
        }

        async function checkNumberExpirationAndTimers() {
            if (!currentUser) return;
            const now = Date.now();
            document.querySelectorAll('.num-timer-badge').forEach(badge => {
                const exp = parseInt(badge.getAttribute('data-expires')) || 0;
                const rem = exp - now;
                badge.innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${formatRemainingTime(rem)}`;
            });
        }

        async function pollOtps() {
            if (!currentUser) return;
            try {
                const latestCloud = await fetchUserFromFirebase(currentUser.id);
                if (latestCloud) {
                    const s = latestCloud.stats || {};
                    userCloudData.stats.totalSuccessOtps = Number(s.totalSuccessOtps ?? latestCloud.successful_otps ?? userCloudData.stats.totalSuccessOtps);
                    userCloudData.stats.balance = Number(s.balance ?? latestCloud.balance ?? userCloudData.stats.balance);
                    if (Array.isArray(latestCloud.successOtps)) userCloudData.successOtps = latestCloud.successOtps;
                    if (Array.isArray(latestCloud.activeNumbers)) userCloudData.activeNumbers = latestCloud.activeNumbers;
                    updateOtpBadge();
                }

                const activeNums = userCloudData.activeNumbers || [];
                if (activeNums.length === 0) return;

                const res = await fetch(`${EBH_OTP_MONITOR_API}?limit=50`, { headers: ebhHeaders() });
                const allSms = extractListFlexible(await res.json());

                let updated = false;
                for (const sms of allSms) {
                    const apiNum = normalizeDigits(sms.number || sms.phoneNumber || sms.phone || sms.to || "");
                    const msg = sms.message || sms.rawSnippet || sms.text || sms.sms || "";
                    const code = String(sms.otp || sms.otpCode || sms.code || extractOtpFromText(msg) || "").trim();

                    if (code && apiNum) {
                        for (const act of activeNums) {
                            const actClean = normalizeDigits(act.number || "");
                            if (actClean && (actClean === apiNum || actClean.endsWith(apiNum) || apiNum.endsWith(actClean)) && !act.otp) {
                                act.otp = code;
                                updated = true;

                                const alreadyExists = (userCloudData.successOtps || []).some(h => h.number === act.number && String(h.otp) === code);
                                if (!alreadyExists) {
                                    userCloudData.successOtps.push({
                                        id: 'otp_' + Date.now(),
                                        timestamp: Date.now(),
                                        number: act.number,
                                        service: act.service,
                                        otp: code,
                                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                                    });
                                    userCloudData.stats.totalSuccessOtps = Number(userCloudData.stats.totalSuccessOtps || 0) + 1;
                                    userCloudData.stats.balance = Number(userCloudData.stats.balance || 0) + Number(globalSettings.otpRate || 5);
                                }
                            }
                        }
                    }
                }

                if (updated) {
                    await syncUserToFirebase();
                    updateOtpBadge();
                    const container = document.getElementById('screenContainer');
                    if (container && container.innerHTML.includes("EBH ACTIVE NUMBERS")) {
                        renderActiveNumbersView();
                    }
                }
            } catch (e) {}
        }

        async function loadLiveTraffic() {
            const container = document.getElementById('screenContainer');
            container.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-300"><i class="fa-solid fa-spinner fa-spin text-emerald-400 mr-2"></i> EBH লাইভ ট্রাফিক লোড হচ্ছে...</div>`;

            try {
                const res = await fetch(`${EBH_OTP_MONITOR_API}?limit=30`, { headers: ebhHeaders() });
                const hits = extractListFlexible(await res.json());

                let html = `<div class="glass-panel rounded-2xl p-4 space-y-2.5 shadow-2xl border border-emerald-500/30 pb-6"><div class="flex justify-between items-center border-b border-slate-800 pb-2"><h3 class="text-xs font-extrabold text-emerald-400 uppercase"><i class="fa-solid fa-satellite-dish mr-1"></i> EBH LIVE TRAFFIC</h3><button onclick="loadLiveTraffic()" class="text-[10px] c-sky px-2 py-0.5 rounded font-bold text-white">Refresh</button></div><div class="space-y-2.5">`;

                if (!hits || hits.length === 0) {
                    html += `<div class="p-4 bg-slate-900/90 border border-slate-800 rounded-xl text-center text-xs text-slate-400">কোনো লাইভ মেসেজ পাওয়া যায়নি।</div>`;
                } else {
                    hits.slice(-25).reverse().forEach(hit => {
                        const cCode = (hit.countryCode || hit.country_code || hit.country || "ET").toString().toUpperCase();
                        const cInfo = getCountryInfo(cCode);
                        const serviceName = (hit.service || "SMS").toString();
                        const rawMessage = hit.message || hit.rawSnippet || hit.text || hit.sms || JSON.stringify(hit);

                        html += `
                            <div class="p-3 bg-slate-900/90 border border-slate-800 rounded-xl space-y-2">
                                <div class="flex justify-between items-center font-bold text-white">
                                    <span>${cInfo.flag} ${cInfo.name} (${cInfo.short})</span>
                                    <span class="c-blue text-white font-mono text-[10px] px-2 py-0.5 rounded-full font-extrabold">${serviceName}</span>
                                </div>
                                <div class="flex justify-end">
                                    <button onclick="buyNumbers('${encodeURIComponent(serviceName)}', '${encodeURIComponent(cInfo.short)}')" class="px-2.5 py-1 c-green text-white text-[10px] font-extrabold rounded-lg shadow">Get Number</button>
                                </div>
                                <div class="text-[11px] text-emerald-300 font-mono bg-black/50 p-2.5 rounded-lg border border-slate-800 break-words leading-relaxed">${rawMessage}</div>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="glass-panel rounded-2xl p-4 text-center text-xs text-rose-400">লোড করতে সমস্যা হয়েছে!</div>`;
            }
        }

        setInterval(checkNumberExpirationAndTimers, 1000);
        setInterval(pollOtps, 2000);
    </script>
</body>
</html>
